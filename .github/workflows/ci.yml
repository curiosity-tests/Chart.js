name: CI

on:
  push:
    branches:
      - master
      - "2.9"
  pull_request:
    branches:
      - master
      - "2.9"
  workflow_dispatch:
    inputs:
      leg:
        description: baseline (uninstrumented) or instrumented (under chalk/curiosity)
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    permissions:
      checks: write  # for coverallsapp/github-action to create new checks
      contents: read  # for dorny/paths-filter to fetch a list of changed files
      pull-requests: read  # for dorny/paths-filter to read pull requests
      id-token: write
    runs-on: ${{ matrix.os }}

    outputs:
      coveralls: ${{ steps.changes.outputs.src }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: pnpm/action-setup@v4.2.0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 16
          cache: pnpm
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'package.json'
              - 'tsconfig.json'
            src:
              - 'src/**'
              - 'package.json'
            test:
              - 'test/**'
              - 'karma.conf.js'
              - 'package.json'
            types:
              - 'package.json'
              - 'tsconfig.json'
      - name: Install
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      # racecar: the `inputs.leg != ''` disjunct is OURS, not upstream's. Under
      # workflow_dispatch dorny/paths-filter has no base ref to diff against, so
      # steps.changes.outputs.* come back false and this step would silently skip
      # -- a green run that tested nothing. It keys on the dispatch input rather
      # than github.event_name, so on a push it is empty and upstream's own
      # changed-files gating applies unchanged.
      - name: Test
        if: |
          (steps.changes.outputs.src == 'true' ||
          (inputs.leg != '' || steps.changes.outputs.test == 'true')) &&
          runner.os != 'Windows'
        # racecar: Firefox is dropped from the karma browser list, read by
        # karma.conf.cjs. Firefox 154 on ubuntu-latest fails the pixel fixture
        # test/fixtures/controller.polarArea/pointLabels/overlapping.js with
        # "Difference: 293px / 0.11%" against "Tolerance: 0.1%" -- reference
        # image drift, not a Chart.js regression. Upstream's last concluded
        # ci.yml push run is 2026-05-27 (chartjs/Chart.js run 26539294666), so
        # upstream has no recent signal on this browser at all. Chrome 152 runs
        # all 1702 specs including every fixture comparison, so no category of
        # work is removed -- only its duplicate on a second engine.
        env:
          CHARTJS_CI_BROWSERS: chrome
        run: |
          pnpm run build
          if [ "${{ runner.os }}" == "macOS" ]; then
            pnpm run test-ci --browsers chrome,safari
          else
            xvfb-run --auto-servernum pnpm run test-ci
          fi
        shell: bash
      - name: Package
        if: steps.changes.outputs.docs == 'true'
        run: |
          pnpm run docs
          pnpm pack
      - name: Coveralls Parallel - Chrome
        # Coveralls is registered for the canonical repo only, so the upload cannot
        # authenticate from a fork. Gated OFF here (the safe direction); the browser
        # tests that produce the coverage still run.
        if: |
          github.repository == 'chartjs/Chart.js' &&
          steps.changes.outputs.src == 'true' &&
          runner.os != 'Windows'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: './coverage/chrome/lcov.info'
          flag-name: ${{ matrix.os }}-chrome
          parallel: true
      - name: Coveralls Parallel - Firefox
        # Coveralls is registered for the canonical repo only, so the upload cannot
        # authenticate from a fork. Gated OFF here (the safe direction); the browser
        # tests that produce the coverage still run.
        if: |
          github.repository == 'chartjs/Chart.js' &&
          steps.changes.outputs.src == 'true' &&
          runner.os != 'Windows'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: './coverage/firefox/lcov.info'
          flag-name: ${{ matrix.os }}-firefox
          parallel: true

  finish:
    permissions:
      checks: write  # for coverallsapp/github-action to create new checks
      contents: read
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Coveralls Finished
        if: needs.build.outputs.coveralls == 'true'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
