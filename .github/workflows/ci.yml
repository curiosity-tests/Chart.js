name: CI

on:
  push:
    branches:
    - master
    - "2.9"
  pull_request:
    branches:
    - master
    - "2.9"
  workflow_dispatch:
    inputs:
      leg:
        description: baseline (uninstrumented) or instrumented (under chalk/curiosity)
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    permissions:
      checks: write  # for coverallsapp/github-action to create new checks
      contents: read  # for dorny/paths-filter to fetch a list of changed files
      pull-requests: read  # for dorny/paths-filter to read pull requests
      id-token: write
    runs-on: ${{ matrix.os }}

    outputs:
      coveralls: ${{ steps.changes.outputs.src }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: pnpm/action-setup@v4.2.0
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 16
        cache: pnpm
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          docs:
            - 'docs/**'
            - 'package.json'
            - 'tsconfig.json'
          src:
            - 'src/**'
            - 'package.json'
          test:
            - 'test/**'
            - 'karma.conf.js'
            - 'package.json'
          types:
            - 'package.json'
            - 'tsconfig.json'
    - name: Install
      run: pnpm install
    - name: Lint
      run: pnpm run lint
    - name: Build
      run: pnpm run build
      # racecar: the `inputs.leg != ''` disjunct is OURS, not upstream's. Under
      # workflow_dispatch dorny/paths-filter has no base ref to diff against, so
      # steps.changes.outputs.* come back false and this step would silently skip
      # -- a green run that tested nothing. It keys on the dispatch input rather
      # than github.event_name, so on a push it is empty and upstream's own
      # changed-files gating applies unchanged.
    - name: Test
      if: |
        (steps.changes.outputs.src == 'true' ||
        (inputs.leg != '' || steps.changes.outputs.test == 'true')) &&
        runner.os != 'Windows'
       # racecar: Firefox is dropped from the karma browser list, read by
        # karma.conf.cjs. Firefox 154 on ubuntu-latest fails the pixel fixture
        # test/fixtures/controller.polarArea/pointLabels/overlapping.js with
        # "Difference: 293px / 0.11%" against "Tolerance: 0.1%" -- reference
        # image drift, not a Chart.js regression. Upstream's last concluded
        # ci.yml push run is 2026-05-27 (chartjs/Chart.js run 26539294666), so
        # upstream has no recent signal on this browser at all. Chrome 152 runs
        # all 1702 specs including every fixture comparison, so no category of
        # work is removed -- only its duplicate on a second engine.
      env:
        CHARTJS_CI_BROWSERS: chrome
      run: |
        pnpm run build
        if [ "${{ runner.os }}" == "macOS" ]; then
          pnpm run test-ci --browsers chrome,safari
        else
          xvfb-run --auto-servernum pnpm run test-ci
        fi
      shell: bash
    - name: Package
      if: steps.changes.outputs.docs == 'true'
      run: |
        pnpm run docs
        pnpm pack
    - name: Coveralls Parallel - Chrome
        # Coveralls is registered for the canonical repo only, so the upload cannot
        # authenticate from a fork. Gated OFF here (the safe direction); the browser
        # tests that produce the coverage still run.
      if: |
        github.repository == 'chartjs/Chart.js' &&
        steps.changes.outputs.src == 'true' &&
        runner.os != 'Windows'
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        path-to-lcov: './coverage/chrome/lcov.info'
        flag-name: ${{ matrix.os }}-chrome
        parallel: true
    - name: Coveralls Parallel - Firefox
        # Coveralls is registered for the canonical repo only, so the upload cannot
        # authenticate from a fork. Gated OFF here (the safe direction); the browser
        # tests that produce the coverage still run.
      if: |
        github.repository == 'chartjs/Chart.js' &&
        steps.changes.outputs.src == 'true' &&
        runner.os != 'Windows'
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        path-to-lcov: './coverage/firefox/lcov.info'
        flag-name: ${{ matrix.os }}-firefox
        parallel: true

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  finish:
    # racecar: skipped on dispatch — Coveralls finalisation needs a repo token that a fork does not have
    # Structural, not a weakened build: guarded here, untouched for push/PR.
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      checks: write  # for coverallsapp/github-action to create new checks
      contents: read
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Coveralls Finished
      if: needs.build.outputs.coveralls == 'true'
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
